<h2>Pacientes</h2>

@if (isLoading()) {
<mat-spinner diameter="30"></mat-spinner>
} @else if (patients().length === 0) {
<p class="empty-message">Aún no hay pacientes registrados</p>
} @else {
<table mat-table [dataSource]="patients()" class="mat-elevation-z1">
    <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Nombre</th>
        <td mat-cell *matCellDef="let patient">{{ patient.name }}</td>
    </ng-container>

    <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef>Email</th>
        <td mat-cell *matCellDef="let patient">{{ patient.email }}</td>
    </ng-container>

    <ng-container matColumnDef="phone">
        <th mat-header-cell *matHeaderCellDef>Teléfono</th>
        <td mat-cell *matCellDef="let patient">{{ patient.phone || '—' }}</td>
    </ng-container>

    <ng-container matColumnDef="createdAt">
        <th mat-header-cell *matHeaderCellDef>Registrado</th>
        <td mat-cell *matCellDef="let patient">{{ formatDate(patient.createdAt) }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
</table>
}
