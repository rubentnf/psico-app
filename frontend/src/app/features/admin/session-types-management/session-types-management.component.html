<div class="header-row">
    <h2>Tipos de sesión</h2>
    <button mat-raised-button color="primary" (click)="openCreateDialog()">
        <mat-icon>add</mat-icon>
        Nuevo tipo de sesión
    </button>
</div>

@if (isLoading()) {
<mat-spinner diameter="30"></mat-spinner>
} @else {
<table mat-table [dataSource]="sessionTypes()" class="mat-elevation-z1">
    <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Nombre</th>
        <td mat-cell *matCellDef="let type">{{ type.name }}</td>
    </ng-container>

    <ng-container matColumnDef="duration">
        <th mat-header-cell *matHeaderCellDef>Duración</th>
        <td mat-cell *matCellDef="let type">{{ type.durationMinutes }} min</td>
    </ng-container>

    <ng-container matColumnDef="price">
        <th mat-header-cell *matHeaderCellDef>Precio</th>
        <td mat-cell *matCellDef="let type">{{ type.price }} €</td>
    </ng-container>

    <ng-container matColumnDef="active">
        <th mat-header-cell *matHeaderCellDef>Activo</th>
        <td mat-cell *matCellDef="let type">
            <mat-slide-toggle [checked]="type.active" (change)="toggleActive(type)"></mat-slide-toggle>
        </td>
    </ng-container>

    <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let type">
            <button mat-icon-button (click)="openEditDialog(type)">
                <mat-icon>edit</mat-icon>
            </button>
        </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
</table>
}
